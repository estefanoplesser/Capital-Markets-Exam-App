      { q: "A 'horizontal' risk-retention slice means the originator retains:", options: ["5% of each tranche across the whole structure","The most junior / first-loss piece","The Aaa tranche only","Nothing"], correct: [1], tag: "recall", explain: "Horizontal retention means keeping the most junior, first-loss position (e.g. unrated bonds or equity). Vertical retention means keeping 5% of every tranche across the structure." },
      { q: "What does the formula EL = PD × LGD × EAD represent?", options: ["The property's market value","Expected Loss — a single number summarising a loan's credit risk","The loan's interest rate","The debt service coverage ratio"], correct: [1], tag: "concept", explain: "EL = PD × LGD × EAD is Expected Loss — Probability of Default × Loss Given Default × Exposure at Default. It summarises a loan's credit risk in one comparable number." },
      { q: "What does LGD (Loss Given Default) measure?", options: ["The likelihood the borrower defaults","The fraction of the exposure the lender expects to lose if a default actually occurs","The total outstanding loan at default","The property's rental income"], correct: [1], tag: "concept", explain: "LGD is the fraction of exposure expected to be lost if default occurs. It is below 100% because the lender can recover value by enforcing on collateral. Higher collateral value and creditor-friendly jurisdictions lower LGD." },
      { q: "Why is LGD typically below 100%?", options: ["Borrowers always repay in full","Even in default, lenders recover some value by enforcing against collateral","Insurance always covers the loss","The government reimburses lenders"], correct: [1], tag: "concept", explain: "LGD is below 100% because, even after a default, the lender can enforce against the collateral — selling the property to recover part of the exposure." },
      { q: "What is EAD (Exposure at Default)?", options: ["The total outstanding loan amount at the moment of default","The probability of default","The property's vacancy rate","The lender's profit margin"], correct: [0], tag: "recall", explain: "EAD is the total outstanding loan amount at the moment of default — the 'amount at risk' on which PD and LGD operate. For a simple bullet loan, EAD equals the original principal." },
      { q: "DSCR is defined as:", options: ["Loan Amount / Property Value","Net Operating Income / Annual Debt Service","NOI / Loan Amount","Property Value / NOI"], correct: [1], tag: "calc", explain: "DSCR = Net Operating Income / Annual Debt Service. A DSCR of 2.0x means income is twice the debt service. Below 1.0x, cash flows cannot cover debt service without extra equity." },
      { q: "A property has NOI of €6m and annual debt service of €3m. What is the DSCR?", options: ["0.5x","1.5x","2.0x","3.0x"], correct: [2], tag: "calc", explain: "DSCR = NOI / Debt Service = €6m / €3m = 2.0x — a strong coverage buffer, meaning income is twice the debt service." },
      { q: "LTV is defined as:", options: ["Loan Amount / Property Value","NOI / Annual Debt Service","Property Value / Loan Amount","NOI / Loan Amount"], correct: [0], tag: "calc", explain: "LTV = Loan Amount / Property Value. A 60% LTV means the property value would need to fall 40% before the loan is 'under water'." },
      { q: "A €60m loan is secured on a property worth €100m. What is the LTV, and how far can value fall before the loan is under water?", options: ["60% LTV; value can fall 40%","40% LTV; value can fall 60%","60% LTV; value can fall 60%","166% LTV; value cannot fall"], correct: [0], tag: "calc", explain: "LTV = €60m / €100m = 60%. The property value can fall 40% (to €60m) before the loan equals the value — the equity cushion is 40%." },
      { q: "Using Property Value = NOI / Cap Rate, what happens to value when the cap rate rises, NOI unchanged?", options: ["Value rises","Value falls","Value is unchanged","Value doubles"], correct: [1], tag: "calc", explain: "Value = NOI / Cap Rate is an inverse relationship. A higher cap rate (the denominator) compresses value even if NOI is stable — which is why rising interest rates hurt property values." },
      { q: "Moody's EMEA CMBS rating methodology has how many sequential steps?", options: ["Three","Five","Seven","Ten"], correct: [2], tag: "recall", explain: "The methodology has 7 steps: Property Grade, Net Cash Flow, Property Value, Loan Default Risk, simulation of defaults/severity, issuer-level note expected loss, and the rating committee." },
      { q: "In Step 1, Moody's grades each property on a scale of 1 to 5. What does Grade 1 represent?", options: ["The worst quality","The best quality","The middle of the range","An unrated property"], correct: [1], tag: "recall", explain: "Grade 1 is the best quality, Grade 5 the worst — a holistic assessment relative to comparable properties of the same type in the same market." },
      { q: "In Step 2, how does Moody's treat the landlord's current rental income?", options: ["It accepts the in-place income at face value","It constructs a 10-year NCF projection stress-testing income as leases expire","It ignores rental income entirely","It uses only the first year's rent"], correct: [1], tag: "concept", explain: "Moody's does not accept in-place income at face value. It builds a 10-year Net Cash Flow projection, modelling lease expiries, void periods and re-letting — stress-testing the income stream." },
      { q: "Why is Moody's Property Value almost always LOWER than the market appraiser's value?", options: ["Moody's uses a stressed forward-looking NCF and applies minimum yield floors","Moody's does not visit the property","Moody's adds a premium for risk","Appraisers always undervalue property"], correct: [0], tag: "concept", explain: "Moody's Value is deliberately conservative: it capitalises a stressed, forward-looking 10-year average NCF, and applies minimum yield floors that stop the cap rate falling below a conservative level." },
      { q: "What is the purpose of Moody's minimum yield floors?", options: ["To inflate property values","To prevent the cap rate falling below a conservative level even when market yields are compressed","To match the appraiser's value exactly","To remove the need for an NCF projection"], correct: [1], tag: "concept", explain: "Minimum yield floors stop the cap rate going below a conservative floor even when market yields have compressed to historic lows — ensuring Moody's Value stays conservative through cycles." },
      { q: "Moody's assesses loan default risk at two stages. What are they?", options: ["Origination risk and audit risk","Term default risk (during the loan) and refinancing default risk (at maturity)","Interest risk and currency risk","Tenant risk and sponsor risk"], correct: [1], tag: "recall", explain: "Step 4 assesses term default risk — the risk the borrower cannot service debt during the loan's life — and refinancing default risk — the risk it cannot repay the bullet principal at maturity." },
      { q: "Why do CMBS loans carry significant refinancing risk?", options: ["They fully amortise over the term","They are almost always interest-only bullet structures, with the full principal due at maturity","They have no maturity date","They are repaid by the servicer"], correct: [1], tag: "concept", explain: "CMBS loans are almost always interest-only bullet loans — the full principal falls due at maturity. The borrower must find new debt to repay it, which is hard if values have fallen or markets have tightened." },
      { q: "What simulation technique does Moody's use in Step 5 to model property value uncertainty?", options: ["A single deterministic forecast","Monte Carlo simulation — thousands of possible outcomes","Linear regression only","The appraiser's point estimate"], correct: [1], tag: "recall", explain: "Step 5 uses Monte Carlo simulation: thousands of scenarios, each with a different property value. Higher rating levels must withstand more severe stress scenarios." },
      { q: "In Moody's jurisdiction tiers, which is the MOST creditor-friendly tier (lowest enforcement cost)?", options: ["Tier 4 — Greece, Portugal, Italy","Tier 1 — UK, Netherlands","Tier 3 — France, Spain, Belgium","Tier 2 — Germany, Switzerland, Austria"], correct: [1], tag: "recall", explain: "Tier 1 (UK, Netherlands) is the most creditor-friendly — lowest enforcement costs, shortest enforcement periods. Tier 4 (Greece, Portugal, Italy, Eastern Europe) is the most debtor-friendly." },
      { q: "Two identical loans on identical properties — one in the UK, one in Italy. How do their LGDs compare?", options: ["Identical — jurisdiction does not matter","The Italian loan has higher assumed LGD due to slower, costlier enforcement","The UK loan has higher LGD","Both have zero LGD"], correct: [1], tag: "concept", explain: "The Italian loan has a higher assumed LGD purely due to jurisdiction: Italy is Tier 4 (debtor-friendly, slow, costly enforcement) while the UK is Tier 1 (fast, cheap enforcement)." },
      { q: "How does pool diversification affect the credit enhancement needed for a given rating?", options: ["Diversification increases the credit enhancement needed","Diversification reduces the credit enhancement needed — the loss distribution is more concentrated around the mean","Diversification has no effect","Diversification only affects the coupon"], correct: [1], tag: "concept", explain: "A diversified pool of loans produces a loss distribution more concentrated around the mean, with less probable extreme tails — so multi-loan CMBS typically need less subordination than single-loan deals." },
      { q: "In Step 6, how is a tranche's Expected Loss derived?", options: ["By taking the appraiser's value","By probability-weighting the tranche loss across all simulated scenarios via the cash flow model","By averaging the coupon rates","By using the sovereign rating"], correct: [1], tag: "concept", explain: "Step 6 runs each simulated loss scenario through the waterfall to get a tranche loss, then probability-weights those across all scenarios. The probability-weighted sum is the Tranche Expected Loss." },
      { q: "What is the 'tail period' in a CMBS transaction?", options: ["The first year after issuance","The gap between the loan maturity and the bond legal final maturity","The marketing period before closing","The time the special servicer takes to act"], correct: [1], tag: "recall", explain: "The tail period is the gap between loan maturity and the bond's legal final maturity — a buffer for enforcement. New deals require a minimum tail of 5–7 years (up to 12 for France and Italy)." },
      { q: "What does Step 7 — the rating committee — add to the quantitative model output?", options: ["Nothing — the model output is final","Qualitative judgement: benchmarking, legal structure review, scenario sensitivity, counterparty risk","A higher rating automatically","The appraiser's valuation"], correct: [1], tag: "concept", explain: "The committee reviews model output but adds qualitative judgement — benchmarking against similar deals, legal structure review, sensitivity testing — so final ratings may differ modestly from the model." },
      { q: "The CMM (Commercial Mortgage Metrics) model is best described as:", options: ["A property appraisal service","Moody's Analytics' statistical CRE credit risk model producing PD, LGD, EL and an implied rating","A legal enforcement tool","A government regulation"], correct: [1], tag: "recall", explain: "CMM is Moody's Analytics' CRE credit risk model. It combines macro inputs, CRE market data and user loan inputs to generate PD (EDF), LGD, EL and an implied rating." },
      { q: "In CMM terminology, 'EDF' refers to:", options: ["Expected Disposal Fee","Expected Default Frequency — CMM's term for PD","Enforcement Default Factor","Equity Discount Function"], correct: [1], tag: "trap", explain: "EDF — Expected Default Frequency — is CMM's terminology for Probability of Default (PD). Same concept, different label." },
      { q: "Select ALL of the following that are explanatory variables in the CMM PD regression model.", options: ["LTV and DSCR","Market vacancy rate","Loan age","Property type"], correct: [0,1,2,3], tag: "recall", explain: "All are CMM PD variables: LTV, DSCR, market vacancy rate, market price change, loan age and property type — six observable variables translated into an annualised PD." },
      { q: "Why does CMM add a qualitative scorecard overlay to its quantitative PD model?", options: ["To slow down the analysis","Because not all risks — like sponsor quality — are captured by quantitative variables","To replace the regression model","Because regulators require it"], correct: [1], tag: "concept", explain: "The qualitative scorecard captures factors the regression misses — sponsor track record, asset and tenant characteristics. A poor sponsor can worsen the PD even if LTV and DSCR look acceptable." },
      { q: "In the Milan office case study, moving from a baseline to a downside macro scenario causes EL to:", options: ["Fall, because the property is safer","Rise, driven by higher vacancy, lower rents and lower values increasing refinancing risk","Stay exactly the same","Become negative"], correct: [1], tag: "concept", explain: "In the downside scenario, vacancy rises and rents fall, so property value and NOI decline, LTV at maturity rises, and refinancing risk grows — pushing PD, LGD and EL all higher." },
      { q: "In the Milan case study, increasing the loan from €60m to €65m (baseline macro) does what to the credit?", options: ["Improves it — more leverage is safer","Worsens it — higher leverage means higher LTV, higher PD and a worse implied rating","Has no effect","Eliminates refinancing risk"], correct: [1], tag: "concept", explain: "A larger loan raises LTV and lowers DSCR, worsening PD, LGD and EL — the implied rating notches down. All else equal, higher leverage means worse credit." },
      { q: "In the case study, EL worsened materially under 'higher loan + downside macro', yet the implied rating band did not move further. Why?", options: ["The model was broken","Rating bands are ranges, not single points — the increment was not large enough to cross a band boundary","EL does not affect ratings","The committee overrode the result"], correct: [1], tag: "concept", explain: "Rating bands are ranges, not single points. EL can worsen within a band without the implied rating changing — it only moves when EL crosses a band boundary." },
      { q: "The Taurus 2021-3 deal was a single-borrower CMBS. Why does that concentrate risk?", options: ["The loan is secured on a single property rather than a diversified pool","Single-borrower deals have no collateral","There is only one bondholder","It removes the need for tranching"], correct: [0], tag: "concept", explain: "Taurus was secured on a single property (The Squaire at Frankfurt Airport). A single-borrower CMBS concentrates risk versus a diversified pool — though The Squaire was internally diversified across office, hotel and retail." },
      { q: "At origination, Moody's Value for The Squaire was about 18.9% below the appraiser's value. The largest single reason was:", options: ["The office space was overvalued","The hotel component was stressed for Covid-19 uncertainty","The retail space was empty","The building was structurally unsound"], correct: [1], tag: "concept", explain: "The hotel component was heavily stressed for Covid-19 uncertainty (hotels were closed/impaired when the deal was rated in April 2021). Office cash flow was also slightly stressed, and a conservative cap rate floor applied." },
      { q: "Select ALL of the following that plausibly drove the post-2021 downgrade of the Taurus notes.", options: ["Hybrid/WFH trends reducing demand for the non-CBD airport office location","ECB interest rate rises raising cap rates and compressing values","Refinancing difficulty at the December 2024 expected maturity","Rising LTV as property values fell"], correct: [0,1,2,3], tag: "concept", explain: "All four contributed: WFH pressure on a non-CBD office, rate-driven cap rate rises compressing value, refinancing difficulty at maturity, and rising LTV — a textbook illustration of the framework under stress." },
      { q: "What is a 'cash trap' mechanism, as used in the Taurus deal?", options: ["A penalty paid to bondholders","If LTV or debt yield breaches a trigger, excess cash is trapped rather than returned to the borrower","A reserve funded by the rating agency","A way to hide cash from investors"], correct: [1], tag: "concept", explain: "A cash trap retains excess cash in the structure rather than paying it to the borrower when a trigger is breached (e.g. LTV > 70% or debt yield < a floor) — a protective feature for noteholders." },
      { q: "What does the Exit Debt Yield (NOI at maturity / outstanding loan balance) tell a lender?", options: ["The property's vacancy rate","How much debt the property can support — a lender's view of refinancing capacity at maturity","The borrower's personal wealth","The bond's coupon"], correct: [1], tag: "concept", explain: "Exit Debt Yield = NOI at maturity / loan balance. It gives a lender's-eye view of how much debt the property income can support — a key gauge of refinancing capacity at loan maturity." },
      { q: "Why is CRE described as 'specialised lending'?", options: ["Only specialists are allowed to lend","The primary source of repayment is the property itself — its rental income and value — not a trading company's revenues","It requires a special government licence","It uses no collateral"], correct: [1], tag: "concept", explain: "CRE is specialised lending because repayment comes primarily from the property — its rental income and capital value — rather than from a diversified operating company. Analysis must go deep into property-level detail." },
      { q: "Which of these is NCF (Net Cash Flow) in Moody's Step 2 framework?", options: ["Gross Rental Income only","Gross Rental Income minus non-recoverable expenses minus CapEx","Property Value times the cap rate","The loan amount minus debt service"], correct: [1], tag: "recall", explain: "NCF = Gross Rental Income − non-recoverable expenses − CapEx. Subtracting non-recoverable expenses from GRI gives NOI; subtracting CapEx from NOI gives NCF — the key input to Moody's Property Value." }
    ],
  },
  {
    id: "reits",
    name: "REITs & RE Bonds",
    short: "REITs & RE Bonds",
    color: "#D4537E",
    bg: "#FBEAF0",
    questions: [
      { q: "In the Moody's REIT/CRE rating scorecard, which factor has the LARGEST weight?", options: ["Business Profile (25%)","Leverage and Coverage (35%)","Access to Capital (20%)","Financial Policy (15%)"], correct: [1], tag: "recall", explain: "Leverage and Coverage is the largest factor at 35%. It splits into Debt/Gross Assets (15%), Net Debt/EBITDA (10%) and EBITDA/Interest (10%)." },
      { q: "Select ALL of the five broad factors in the Moody's REIT scorecard.", options: ["Scale","Business Profile","Access to Capital","Leverage and Coverage"], correct: [0,1,2,3], tag: "recall", explain: "All four are scorecard factors, alongside Financial Policy (15%). The five: Scale 5%, Business Profile 25%, Access to Capital 20%, Leverage and Coverage 35%, Financial Policy 15%." },
      { q: "Which REIT scorecard factor is purely qualitative, with no sub-factors?", options: ["Scale","Business Profile","Financial Policy","Leverage and Coverage"], correct: [2], tag: "recall", explain: "Financial Policy (15%) is a single qualitative factor with no sub-factors — it captures how conservative the issuer's financial management is and its appetite for event risk." },
      { q: "The Business Profile factor (25%) splits into which two sub-factors?", options: ["Asset Quality (15%) and Market Characteristics (10%)","Debt/Gross Assets and Net Debt/EBITDA","Access to Capital and Asset Encumbrance","Gross Assets and Financial Policy"], correct: [0], tag: "recall", explain: "Business Profile (25%) splits into Asset Quality (15%) and Market Characteristics (10%) — covering portfolio quality and the markets the REIT operates in." },
      { q: "For a Baa-rated REIT, the Debt/Gross Assets threshold is approximately:", options: ["≤5%","5–15%","30–50%","65–80%"], correct: [2], tag: "recall", explain: "Baa Debt/Gross Assets sits at roughly 30–50%. Lower ratios map to higher ratings (Aa is 5–15%); higher ratios map to speculative grade (Ba is 50–65%)." },
      { q: "For a Baa-rated REIT, the EBITDA/Interest coverage threshold is approximately:", options: ["≥10x","7–10x","2.5–4.5x","<1x"], correct: [2], tag: "recall", explain: "Baa EBITDA/Interest is roughly 2.5–4.5x. Stronger ratings need higher coverage (A is 4.5–7x); weaker coverage maps to speculative grade." },
      { q: "Why does Moody's apply 'Global Standard Adjustments' to an issuer's financial statements?", options: ["To make the issuer look better","To capture underlying economics more accurately and improve comparability across issuers","To comply with tax law","To reduce the issuer's reported debt"], correct: [1], tag: "concept", explain: "Standard adjustments capture underlying economics more accurately, improve comparability (Local GAAP vs IFRS), segregate unusual items, and use prudent estimates — so issuers can be compared on a like-for-like basis." },
      { q: "Select ALL of the following items that Moody's treats as CORE / RECURRING (NOT adjusted out).", options: ["Restructuring costs","M&A transaction costs","COVID-19-related costs","Gains on the disposal of fixed assets"], correct: [0,1,2], tag: "trap", explain: "Restructuring costs, M&A costs and COVID-19 costs are treated as core/recurring. Gains on ASSET DISPOSALS are the opposite — Moody's may adjust those OUT as unusual. Watch this distinction." },
      { q: "Which of the following would Moody's likely adjust OUT as an unusual item?", options: ["Restructuring costs","Gains or losses on the extinguishment of debt","M&A transaction costs","Impairment of working capital"], correct: [1], tag: "trap", explain: "Gains/losses on debt extinguishment are adjusted out as unusual — as are fixed-asset impairments, asset disposal gains/losses and capital-structure transaction fees. Restructuring, M&A and working-capital impairment are core/recurring." },
      { q: "What is a covenant?", options: ["A type of equity share","An issuer's contractual promise to take (affirmative) or not take (negative) an action","A property valuation method","A rating modifier"], correct: [1], tag: "concept", explain: "A covenant is the issuer's contractual 'promise' to either take an action (affirmative) or refrain from one (negative). Covenants are the primary form of bondholder protection." },
      { q: "Covenants are best described as the primary tool to manage which conflict?", options: ["Borrower versus servicer","Bondholders versus shareholders","Rating agency versus issuer","Tenant versus landlord"], correct: [1], tag: "concept", explain: "Covenants manage the bondholder-versus-shareholder conflict: bondholders want steady coupons and repayment; shareholders want to maximise value. Covenants protect the bondholder side." },
      { q: "Select ALL of the 'Three Ps' — the areas covered by restrictive high-yield covenants.", options: ["Restricted Payments (cash leakage)","Debt Incurrence (leveraging)","Change of Control (ownership change)","Property Valuation (appraisal)"], correct: [0,1,2], tag: "recall", explain: "The Three Ps are Restricted Payments, Debt Incurrence, and Change of Control. Property valuation is not one of them — the Ps restrict cash leakage, new debt, and ownership change." },
      { q: "Which covenant appears across ALL bond types — traditional HY, HY-lite, fallen angel and investment grade?", options: ["Restricted Payments","Debt Incurrence","The Negative Pledge (Liens)","Dividend Blockers"], correct: [2], tag: "trap", explain: "The Negative Pledge (Liens covenant) is the ONE covenant present in every bond type — IG, HY and HY-lite. Restricted Payments, Debt Incurrence and Dividend Blockers appear only in traditional HY." },
      { q: "Investment-grade bonds typically have which covenant package?", options: ["The full restrictive package — debt incurrence, restricted payments, dividend blockers","Almost no restrictive covenants — essentially the negative pledge plus events of default","More covenants than high-yield bonds","No events of default"], correct: [1], tag: "concept", explain: "IG bonds carry almost no restrictive covenants — typically just the negative pledge and standard events of default. The full restrictive package is a high-yield feature." },
      { q: "The JLR case study shows that as an issuer's rating improves, its covenant package:", options: ["Becomes more restrictive","Weakens — bondholders get less protection as the company is seen as safer","Stays exactly the same","Is removed entirely"], correct: [1], tag: "concept", explain: "The JLR case shows covenants weaken as ratings improve: JLR moved from a full HY package (B1, 2012) to HY-lite as its rating rose. A safer-looking company can negotiate weaker covenant protection." },
      { q: "Which factor tends to result in MORE covenants being negotiated?", options: ["A higher (Ba) rating","A lower (B) rating","Private equity ownership","Strong market conditions"], correct: [1], tag: "concept", explain: "A lower rating (B versus Ba) means more covenants — weaker credits must offer bondholders more protection. PE owners and strong markets, by contrast, tend to secure weaker covenants." },
      { q: "How does a negative covenant typically work structurally?", options: ["An absolute prohibition with no exceptions","A rule ('may not...') subject to conditions ('unless...') and carve-outs ('except...')","A promise to always pay dividends","A guarantee from the government"], correct: [1], tag: "concept", explain: "A negative covenant follows a rule / unless / except structure: a prohibition ('the issuer may not pay a dividend...'), conditions that permit it (tests met, no default), and specific permitted carve-outs." },
      { q: "In the REIT scorecard, what does the Asset Encumbrance sub-factor measure?", options: ["The age of the buildings","The proportion of unencumbered assets — those not pledged as collateral","The number of tenants","The dividend payout ratio"], correct: [1], tag: "concept", explain: "Asset Encumbrance measures the proportion of unencumbered assets. An Aaa REIT has nearly all assets unencumbered; a Ca REIT has nearly all pledged — unencumbered assets give financial flexibility." },
      { q: "The Moody's REIT liquidity analysis assumes:", options: ["Full access to capital markets","NO access to capital markets — no new debt or equity issuance","Government support is available","All assets can be sold instantly"], correct: [1], tag: "trap", explain: "REIT liquidity is assessed over 12–18 months assuming NO access to capital markets — the issuer cannot raise new debt or equity. Sources are unrestricted cash, internal generation and committed facilities." },
      { q: "The REIT liquidity assessment uses what time horizon?", options: ["6 months","12–18 months","2 years","5 years"], correct: [1], tag: "trap", explain: "REIT/CRE liquidity is assessed over 12–18 months. This contrasts with the Social Housing methodology, which uses a 2-year horizon — a frequently tested difference." },
      { q: "In the Asset Quality sub-factor, single-tenant concentration is flagged as a credit risk when one tenant exceeds roughly:", options: ["1–2% of revenue","5% of revenue","15–25% of revenue","50% of revenue"], correct: [2], tag: "recall", explain: "A single tenant representing more than about 15–25% of revenue flags tenant concentration risk — the REIT becomes overly dependent on one tenant's credit and renewal decisions." },
      { q: "Within Market Characteristics, a large supply pipeline is viewed as:", options: ["Better — more space to lease","Worse — new supply pressures rents and occupancy","Neutral","Irrelevant to credit"], correct: [1], tag: "concept", explain: "A large supply pipeline is worse for credit — new competing space pressures rents and occupancy. Limited supply is better. Market Characteristics also covers macro demand, regulation and market liquidity." },
      { q: "Why do open-ended funds require stronger governance and more conservative balance sheets?", options: ["They have no assets","They carry redemption risk — investors can withdraw capital","They are government-owned","They cannot issue debt"], correct: [1], tag: "concept", explain: "Open-ended funds face redemption risk: investors can pull capital, which is non-permanent. That risk means they need stronger governance and more conservative balance sheets to maintain a given rating." },
      { q: "Moody's current European CRE sector outlook is best summarised as:", options: ["Credit risks tilted negative, but fundamentals and liquidity support a stable outlook","Strongly positive across all segments","Strongly negative with no mitigants","No outlook is published"], correct: [0], tag: "concept", explain: "Moody's sees European CRE credit risks tilted negative — higher rates pressure coverage, leverage is elevated — but solid liquidity and staggered maturities support an overall stable outlook for IG issuers." },
      { q: "In the European CRE sector snapshot, which segment faces AI as a structural risk via potential workforce reduction?", options: ["Logistics","Office","Multi-family residential","Retail"], correct: [1], tag: "recall", explain: "Office faces AI as a structural risk — potential workforce reduction lowering space demand. Office demand is also shifting toward high-quality, eco-friendly, prime locations." },
      { q: "Which European CRE segment shows sustained rental growth driven by a structural demand-supply imbalance?", options: ["Secondary retail","Secondary office","Multi-family residential","Logistics"], correct: [2], tag: "recall", explain: "Multi-family residential shows sustained rental growth from a structural demand-supply imbalance (reduced construction). The main risk is affordability and regulation curbing that growth." },
      { q: "Why did rising European interest rates reduce the attractiveness of CRE versus government bonds?", options: ["CRE became illegal to own","Rising rates reduced the premium of property yields over government debt","Government bonds stopped paying interest","CRE yields rose faster than rates"], correct: [1], tag: "concept", explain: "Rising rates lifted government bond yields, shrinking the premium that property yields offered over them — making CRE relatively less attractive until CRE yields widened to restore the risk premium." },
      { q: "In the peer narratives, what is the typical relationship between upgrade triggers and leverage?", options: ["An upgrade requires higher leverage","An upgrade requires lower leverage — e.g. Debt/Assets falling below a threshold","Leverage is irrelevant to upgrades","Upgrades depend only on the coupon"], correct: [1], tag: "concept", explain: "Upgrade triggers consistently require lower leverage (e.g. Debt/Assets below a threshold, Net Debt/EBITDA down, interest cover up). Downgrade triggers are the mirror image — leverage rising above a threshold." },
      { q: "A REIT peer is rated 'A3 / Stable'. What does the 'Stable' element indicate?", options: ["An upgrade is imminent","A low likelihood of a rating change over the medium term","The rating is under active review","A downgrade is imminent"], correct: [1], tag: "recall", explain: "A Stable outlook indicates a low likelihood of a rating change over the medium term. Positive/Negative signal a higher likelihood of an upgrade/downgrade; Under Review means active consideration." },
      { q: "Why are shareholder loans (SHLs) treated as worsening a REIT's leverage and coverage metrics?", options: ["They are equity and improve the balance sheet","They are debt-like obligations that increase leverage and reduce coverage","They are tenant deposits","They have no effect on metrics"], correct: [1], tag: "concept", explain: "Shareholder loans are debt-like and count against leverage and coverage metrics — which is why some peer narratives quote leverage triggers both including and excluding SHLs." },
      { q: "A common weakness cited for logistics REIT peers with large development pipelines is:", options: ["Too much cash on the balance sheet","Execution risk if capex is not matched by disposals or equity","Having no tenants","Excessively long leases"], correct: [1], tag: "concept", explain: "A sizeable development pipeline brings execution risk: if development capex is not funded by matching disposals or equity, leverage rises. It is a recurring weakness in the peer narratives." },
      { q: "An open-ended fund REIT peer's recurring weakness is most often:", options: ["No access to capital","Redemption risk — non-permanent capital from investor withdrawals","Excessive unencumbered assets","Too conservative a financial policy"], correct: [1], tag: "concept", explain: "Open-ended fund peers (e.g. Prologis European Logistics Fund) repeatedly cite redemption risk — capital is non-permanent because investors can redeem — as a key weakness versus closed-ended structures." },
      { q: "After a Negative outlook, roughly what share of issuers are downgraded within 18 months?", options: ["About 10%","About one third","About two thirds","About 90%"], correct: [1], tag: "recall", explain: "Around one third of issuers are downgraded within 18 months of a Negative outlook (and likewise upgraded after a Positive outlook). Rating action typically follows an outlook within 12–18 months." },
      { q: "Roughly what share of issuers with a Stable outlook experience no rating change in the following year?", options: ["About 30%","About 50%","About 70%","About 90%"], correct: [3], tag: "recall", explain: "About 90% of issuers with a Stable outlook see no rating change in the following year — consistent with 'Stable' meaning a low likelihood of change over the medium term." },
      { q: "What does a rating Outlook represent?", options: ["The current rating level","An opinion on the likely direction of a rating over the medium term","The coupon on the bond","The issuer's share price target"], correct: [1], tag: "concept", explain: "An Outlook is an opinion on the likely medium-term direction of a rating: Positive (likely upgrade), Negative (likely downgrade), Stable (likely no change), or Under Review (active consideration)." },
      { q: "Select ALL of the following that are among the five ESG risks Moody's highlights for European real estate.", options: ["Carbon transition risk","Physical climate risk","Social risks (heightened in residential)","Governance risks from ownership structures and JVs"], correct: [0,1,2,3], tag: "recall", explain: "All four are highlighted, alongside tightening environmental regulation — five ESG risks for European RE: carbon transition, environmental regulation, physical climate, social, and governance risks." },
      { q: "How is ESG incorporated into Moody's ratings?", options: ["It is ignored entirely","Through Issuer Profile Scores (IPSs), which can affect scorecard factors and other considerations","Only via a separate ESG rating","By adjusting the bond coupon"], correct: [1], tag: "recall", explain: "ESG is incorporated through Issuer Profile Scores (IPSs). These can affect scorecard factors and considerations outside the scorecard — ESG is integrated into the credit view, not a standalone score." },
      { q: "Why is Asset Quality assessed partly on 'stability of operating cash flow through the real estate cycle'?", options: ["Cycle stability is irrelevant","A portfolio whose cash flows hold up through downturns is higher quality and lower risk","Only peak-cycle income matters","It measures the building's age"], correct: [1], tag: "concept", explain: "Asset Quality rewards cash flow that stays stable through the real estate cycle — occupancy and income that hold up in downturns indicate a more resilient, higher-quality portfolio." },
      { q: "In the REIT scorecard, the Scale factor is measured by:", options: ["Gross Assets","Net Debt/EBITDA","Operating margin","Number of tenants"], correct: [0], tag: "recall", explain: "Scale (5%) is measured by Gross Assets. Larger asset bases map to higher rating categories — Aaa needs around $60bn+, while Baa sits at roughly $2–10bn." },
      { q: "Which best describes a Baa-grade Financial Policy?", options: ["Extremely conservative, essentially no event risk","Balances creditor and shareholder interests, with some risk of debt-funded acquisitions","Strongly favours shareholders, above-average financial risk","Creates elevated risk of debt restructuring"], correct: [1], tag: "recall", explain: "A Baa Financial Policy balances creditor and shareholder interests, with some risk of debt-funded acquisitions. Aaa/Aa is extremely conservative; Ba/B favours shareholders; Caa/Ca implies restructuring risk." },
      { q: "Why does Moody's segregate unusual or non-recurring items when adjusting financials?", options: ["To inflate reported earnings","To reveal the underlying recurring earnings power, improving comparability","To comply with the issuer's request","To hide losses"], correct: [1], tag: "concept", explain: "Segregating unusual items strips out one-off noise so the recurring, underlying earnings power is visible — making issuers comparable on a consistent basis." },
      { q: "A 'fallen angel' bond is best described as:", options: ["A bond that was always high yield","A bond downgraded from investment grade to high yield","A bond with no covenants","A government bond"], correct: [1], tag: "concept", explain: "A fallen angel is a bond downgraded from investment grade into high yield. In the covenant comparison, fallen angels typically carry only the negative pledge and events of default — light covenant protection." },
      { q: "Why might a private-equity-owned issuer secure weaker covenants than an entrepreneur-owned one?", options: ["PE owners have no negotiating power","PE sponsors typically have the market sophistication and leverage to negotiate weaker covenant packages","Regulators require it","PE-owned issuers are always investment grade"], correct: [1], tag: "concept", explain: "Ownership influences covenant negotiation: PE sponsors typically negotiate weaker covenants, reflecting their market sophistication and bargaining power, versus entrepreneur or public ownership." },
      { q: "Sustained rental growth in multi-family residential is partly threatened by which risk?", options: ["Excess construction flooding the market","Affordability pressures and regulation curbing rent growth","Falling population","Tenants having too-long leases"], correct: [1], tag: "concept", explain: "Multi-family rental growth, driven by a demand-supply imbalance, is threatened mainly by affordability and regulation — political and regulatory intervention can curb how far rents are allowed to rise." },
      { q: "The 'Three Ps' covenant for Restricted Payments primarily limits:", options: ["How much additional debt can be incurred","How much cash can be paid out (dividends) and what investments can be made","Changes in majority ownership","The issuer's choice of auditor"], correct: [1], tag: "recall", explain: "The Restricted Payments covenant limits cash leakage — how much can be paid out as dividends and what investments can be made, including the use of asset sale proceeds." },
      { q: "The Change of Control covenant typically gives bondholders what right?", options: ["To appoint the CEO","To require the issuer to repurchase the bonds (often at 101) on a change of majority ownership","To convert bonds into equity","To extend the maturity indefinitely"], correct: [1], tag: "recall", explain: "On a change of control — sale or change of majority ownership — the covenant typically lets bondholders require the issuer to repurchase the bonds, commonly at 101 in high-yield structures." },
      { q: "What is the primary purpose of the negative pledge (liens) covenant?", options: ["To force the issuer to pay dividends","To restrict the issuer from pledging assets as security to other creditors, protecting bondholders' claim","To guarantee a fixed coupon","To allow unlimited new debt"], correct: [1], tag: "concept", explain: "The negative pledge restricts the issuer from granting liens (security) over its assets to other creditors — preserving the relative position of the bondholders. It is the one covenant in every bond type." },
      { q: "Why does Moody's state that the scorecard-indicated outcome 'often differs' from the assigned rating?", options: ["The scorecard is unreliable","Rating committees apply judgement and consider factors beyond the scorecard's mechanical output","Issuers choose their own rating","The scorecard is only used for marketing"], correct: [1], tag: "concept", explain: "The scorecard is a structured summary of key factors, not the final word. Committees weigh additional considerations — liquidity, ownership, strategy, cycle effects — so the assigned rating often differs." },
      { q: "The Leverage and Coverage factor (35%) splits into which three sub-factors?", options: ["Debt/Gross Assets, Net Debt/EBITDA, EBITDA/Interest","Asset Quality, Market Characteristics, Scale","Operating Margin, SHLIC, CVIC","Access to Capital, Asset Encumbrance, Financial Policy"], correct: [0], tag: "recall", explain: "Leverage and Coverage (35%) splits into Debt/Gross Assets (15%), Net Debt/EBITDA (10%) and EBITDA/Interest (10%) — the largest and most heavily weighted part of the REIT scorecard." },
      { q: "Access to Capital (20%) in the REIT scorecard splits into which two sub-factors?", options: ["Access to Capital and Asset Encumbrance","Scale and Financial Policy","Asset Quality and Market Characteristics","Debt/Gross Assets and Net Debt/EBITDA"], correct: [0], tag: "recall", explain: "The Access to Capital factor (20%) splits into Access to Capital (10%) — track record of raising diverse, cost-effective capital — and Asset Encumbrance (10%) — the proportion of unencumbered assets." }
    ],
  },
  {
    id: "peprivatedebt",
    name: "Private Equity & Private Debt",
    short: "PE & Private Debt",
    color: "#BA7517",
    bg: "#FAEEDA",
    questions: [
      { q: "Select ALL of the three drivers of real estate return.", options: ["Current income (income today)","Income growth (income tomorrow)","Market repricing (cap rate re-rating)","Tenant satisfaction surveys"], correct: [0,1,2], tag: "recall", explain: "The three drivers are current income, income growth, and market repricing. Every real estate return comes from one or more of these three sources. Tenant surveys are not a return driver." },
      { q: "For a debt investor (lender), which return driver is the primary — often only — source of return?", options: ["Market repricing","Income growth","Current income (the coupon)","Cap rate compression"], correct: [2], tag: "concept", explain: "For lenders, current income — the coupon — is the primary and often only return driver. Lenders do not capture income growth (except indirectly via credit migration) or market repricing." },
      { q: "Which return drivers does an equity holder capture, versus a lender?", options: ["Equity captures all three; lenders primarily capture only current income","Lenders capture all three; equity captures only income","Both capture all three equally","Neither captures repricing"], correct: [0], tag: "concept", explain: "Equity holders capture all three drivers — income, growth and repricing. Lenders primarily capture current income only; they do not directly benefit from growth or repricing." },
      { q: "What does cap rate compression do to asset value, with cash flow unchanged?", options: ["Destroys value","Lifts asset value without any change in cash flow","Has no effect on value","Reduces the coupon"], correct: [1], tag: "concept", explain: "Cap rate compression lifts asset value without touching cash flow (Value = NOI / Cap Rate; a lower cap rate raises value). Cap rate decompression destroys value just as fast — it works both ways." },
      { q: "A property has €2m NOI. At a 5% cap rate it is worth €40m. At a 4% cap rate, what is it worth?", options: ["€30m","€40m","€50m","€80m"], correct: [2], tag: "calc", explain: "Value = NOI / Cap Rate = €2m / 0.04 = €50m. A 1% cap rate move (5%→4%) lifts value 25% — from €40m to €50m — purely from repricing, with no change in cash flow." },
      { q: "Which investment strategy relies primarily on contractual coupon and fees as its return?", options: ["Core / Core+ real estate","Value-add / opportunistic real estate","Private real estate debt","Development equity"], correct: [2], tag: "recall", explain: "Private real estate debt earns a contractual coupon plus fees, with a typical IRR of around 6–12%. It does not rely on income growth or repricing the way equity strategies do." },
      { q: "'Core real estate is a debt strategy because it has low returns.' This statement is:", options: ["True — low returns mean debt","False — Core is an EQUITY strategy with relatively low returns","True — Core is always senior debt","False — Core is opportunistic equity"], correct: [1], tag: "trap", explain: "Core is an EQUITY strategy with relatively low returns (around 5–8% IRR) — not a debt strategy. Low return does not mean debt. This is a classic trap." },
      { q: "Private real estate debt IRR (around 6–12%) overlaps with which equity strategy at the lower end?", options: ["Value-add / opportunistic","Core / Core+ (around 5–8%)","Development equity","There is no overlap"], correct: [1], tag: "trap", explain: "Private debt's 6–12% IRR overlaps at the lower end with Core equity's 5–8%. They are different instruments with different risk despite overlapping return ranges — a deliberate exam trap." },
      { q: "Select ALL of the following that are examples of a base rate used in floating-rate loan coupons.", options: ["SONIA (Sterling Overnight Index Average)","Euribor (Euro Interbank Offered Rate)","The cap rate","The DSCR"], correct: [0,1], tag: "recall", explain: "SONIA (UK) and Euribor (Eurozone) are base rates — a floating coupon is the base rate plus a spread. The cap rate and DSCR are not base rates." },
      { q: "A 'bullet' loan structure means:", options: ["The loan amortises fully over the term","0% amortisation — the entire principal is repaid at maturity","The loan has a floating rate","The loan has no maturity date"], correct: [1], tag: "trap", explain: "A bullet loan has 0% amortisation — the entire principal is repaid in one lump at maturity. Do not confuse it with partial amortisation, where the balance is paid down over time." },
      { q: "Why are fees explicitly highlighted as important to a lender's return?", options: ["Fees are irrelevant to realised IRR","Origination, extension and exit fees are meaningful to a lender's realised IRR — not just the coupon","Fees only matter to the borrower","Fees replace the coupon entirely"], correct: [1], tag: "trap", explain: "A lender's return has two components — the interest coupon AND fees (origination, extension, exit, unused-line). Fees are explicitly called out as meaningful to realised IRR; assuming only the coupon matters is a trap." },
      { q: "Select ALL of the following that are reasons private debt exists.", options: ["Post-GFC Basel III/IV regulation made transitional RE lending expensive for banks","Banks retreated from certain lending segments, leaving a gap","Complex deals (development, repositioning, transitional assets) need bespoke underwriting","Private credit funds can charge higher coupons for taking additional risk"], correct: [0,1,2,3], tag: "recall", explain: "All four explain why private debt exists: Basel regulation made bank lending expensive, banks retreated, complex deals need bespoke underwriting, and private funds fill the gap charging higher coupons for the risk." },
      { q: "In the capital stack, where does senior debt sit?", options: ["Bottom of the stack — first loss, highest upside","Top of the stack — safest, lowest yield, paid first","Middle — between equity and mezzanine","Outside the stack entirely"], correct: [1], tag: "concept", explain: "Senior debt sits at the top of the stack — safest, lowest yield, paid first. Equity sits at the bottom — first loss, highest upside, paid last." },
      { q: "How do gains and losses move through the capital stack?", options: ["Gains rise up, losses fall down","Gains fall DOWN the stack (to equity first); losses rise UP the stack (hitting equity first)","Both gains and losses hit senior first","Gains and losses are shared equally"], correct: [1], tag: "concept", explain: "Gains fall down the stack and accrue to equity first; losses rise up the stack, hitting equity first, then mezzanine, then senior last. Equity has the most upside and the first loss." },
      { q: "In a downside scenario, which tranche absorbs losses first?", options: ["Senior debt","Mezzanine","Equity","They share losses equally"], correct: [2], tag: "concept", explain: "Equity absorbs losses first. Mezzanine absorbs losses second. Senior debt is protected last — it only takes a loss once equity and mezzanine are wiped out." },
      { q: "'Mezzanine is the safest tranche in the capital stack.' This statement is:", options: ["True — mezzanine is senior to everything","False — mezzanine absorbs losses second; senior is safest, equity absorbs losses first","True — mezzanine has no risk","False — equity is the safest tranche"], correct: [1], tag: "trap", explain: "Mezzanine is NOT the safest — it absorbs losses second, after equity. Senior debt is the safest. Mezzanine sits between senior and equity in both risk and return. A common trap." },
      { q: "What does the 'attachment point' of a tranche define?", options: ["Where the tranche ends (top of exposure)","Where the tranche starts (bottom of its exposure)","The tranche's coupon","The maturity date"], correct: [1], tag: "recall", explain: "The attachment point is where the tranche starts — the bottom of its exposure. The detachment point is where it ends — the top. Together they define the tranche's risk and return profile." },
      { q: "In a Senior + Mezz + Equity structure, which tranche is most often retained by the private lender?", options: ["The senior loan — typically syndicated out to banks","The mezzanine — the 'private lender position'","The equity — kept by the sponsor","None — all are sold"], correct: [1], tag: "concept", explain: "The senior loan is typically syndicated out to banks; equity stays with the sponsor; the mezzanine is often retained by the private lender — the 'private lender position'." },
      { q: "What is the unlevered return on an all-equity purchase of a €100m asset generating €5m NOI?", options: ["2.5%","5.0%","7.5%","10.0%"], correct: [1], tag: "calc", explain: "Unlevered return = NOI / Total Investment = €5m / €100m = 5.0%. With no leverage there is no spread or amplification — the equity earns exactly the cap rate." },
      { q: "An asset yields 5%. A loan at 75% LTV costs 4%. Using the levered return shortcut, what is the levered equity return?", options: ["5.0%","6.0%","8.0%","12.0%"], correct: [2], tag: "calc", explain: "Levered Return = Unlevered Return + Turns of Leverage × Net Interest Margin. Turns = 75/25 = 3x; NIM = 5% − 4% = 1%. So 5% + 3 × 1% = 8.0%." },
      { q: "What is 'negative carry'?", options: ["When the asset yield exceeds the cost of debt","When the asset yield is BELOW the cost of debt","When a loan has no coupon","When equity earns more than the cap rate"], correct: [1], tag: "concept", explain: "Negative carry is when the asset yield is below the cost of debt. In that case leverage destroys value rather than amplifying return — one of the most exam-tested concepts." },
      { q: "When does leverage AMPLIFY equity returns?", options: ["When asset yield is below the cost of debt","When asset yield equals the cost of debt","When asset yield exceeds the cost of debt","Leverage always amplifies returns"], correct: [2], tag: "concept", explain: "Leverage amplifies returns when the asset yield exceeds the cost of debt (positive spread). When yield equals debt cost, leverage does nothing; when yield is below debt cost, leverage destroys value." },
      { q: "When asset yield exactly EQUALS the cost of debt, leverage:", options: ["Amplifies the return","Does nothing — it is neutral","Destroys value","Doubles the return"], correct: [1], tag: "concept", explain: "When asset yield equals the cost of debt, the net interest margin is zero, so leverage does nothing — the levered return equals the unlevered return regardless of how much debt is used." },
      { q: "'Turns of leverage' is defined as:", options: ["Debt ÷ Equity","Equity ÷ Debt","NOI ÷ Debt Service","Loan ÷ Property Value"], correct: [0], tag: "calc", explain: "Turns of Leverage = Debt ÷ Equity. At 75% LTV, debt is 75 and equity is 25, so turns = 75/25 = 3x. It measures how many times equity is multiplied by debt." },
      { q: "At 3x leverage, a 25% fall in asset value does what to the equity?", options: ["Reduces equity by 25%","Reduces equity by 50%","Wipes out the equity completely (−100%)","Has no effect on equity"], correct: [2], tag: "calc", explain: "Equity Loss % = Asset Value Decrease % × (Turns of Leverage + 1) = 25% × (3 + 1) = 100%. A 25% value fall at 3x leverage wipes out the equity entirely, while the debt remains fully covered." },
      { q: "Using Equity Loss % = Asset Decline % × (Turns + 1), a 5% asset value fall at 3x leverage cuts equity by:", options: ["5%","15%","20%","25%"], correct: [2], tag: "calc", explain: "Equity Loss % = 5% × (3 + 1) = 20%. Leverage magnifies the loss — a modest 5% asset decline becomes a 20% hit to equity at 3x leverage." },
      { q: "Net Interest Margin (NIM) in the levered return formula is:", options: ["Debt Cost − Unlevered Return","Unlevered Return − Debt Cost","Coupon + Fees","NOI ÷ Loan Amount"], correct: [1], tag: "calc", explain: "NIM = Unlevered Return − Debt Cost. A positive NIM means leverage amplifies returns; a negative NIM (negative carry) means leverage destroys value." },
      { q: "The key exam statement 'debt is equity thinking priced differently' means:", options: ["Debt and equity are identical instruments","Debt and equity view the same deal from a different seat in the capital structure — different risk, different price","Debt always earns more than equity","Equity has no risk"], correct: [1], tag: "concept", explain: "The same deal is viewed from a different seat in the capital structure: debt and equity price the same underlying asset differently because they take different risk. Position is a risk choice, not a fixed role." },
      { q: "Which investment strategy relies on BOTH income growth AND multiple expansion (repricing)?", options: ["Core / Core+","Value-add / opportunistic","Private real estate debt","Senior lending"], correct: [1], tag: "concept", explain: "Value-add / opportunistic relies on both income growth (driver 2) and market repricing / multiple expansion (driver 3) — not just current income. Its typical IRR is around 12–20%+." },
      { q: "Select ALL of the following that are INVESTMENT-LEVEL benefits of leverage.", options: ["Return amplification when asset return exceeds cost of debt","Enhanced competitivity — buyers can pay more and still hit targets","Operational discipline — management focused on deleveraging","Dividend recapitalisation at the fund level"], correct: [0,1,2], tag: "recall", explain: "The first three are investment-level benefits. Dividend recapitalisation is a FUND-level benefit, not investment-level. The course distinguishes investment-level (I) from fund-level (F) effects." },
      { q: "Which is a FUND-LEVEL risk of leverage?", options: ["Loss amplification on a single deal","Refinancing risk — a maturity wall in an unfavourable market delaying payouts","Overpaying for a single asset","Covenant breach on one loan"], correct: [1], tag: "concept", explain: "Refinancing risk — a maturity wall in an unfavourable market delaying investor payouts — is a fund-level risk. Loss amplification, overpaying and covenant breaches are investment-level risks." },
      { q: "Why can cheap debt encourage 'overpaying' for an asset?", options: ["Cheap debt has no cost","Cheap debt lets buyers bid more aggressively, away from the asset's true economic value","Cheap debt forces lower prices","Cheap debt eliminates risk"], correct: [1], tag: "concept", explain: "Cheap debt lets buyers pay more and still hit return targets, encouraging aggressive pricing that drifts away from the asset's true economic value — a recognised investment-level risk of leverage." },
      { q: "Which three tranches can all exist on the same deal, at different risk and price?", options: ["Senior mortgage, mezzanine loan, equity","Aaa, Aa, A bonds only","SONIA, Euribor, cap rate","Core, value-add, opportunistic"], correct: [0], tag: "concept", explain: "Senior mortgage, mezzanine loan and equity can all sit on the same deal — three seats at the same table. Senior is paid first at the lowest yield; equity is paid last with the highest upside." },
      { q: "A typical indicative yield for a senior mortgage versus equity is:", options: ["Senior 12–20%+; equity 3–5%","Senior 3–5%; equity 12–20%+","Both around 8–13%","Senior and equity have identical yields"], correct: [1], tag: "recall", explain: "Senior mortgage yields around 3–5% (first claim, lowest risk); equity targets 12–20%+ (residual cash flow and capital gain, highest risk). Mezzanine sits between, around 8–13%." },
      { q: "How does levered return vary with the cap rate and the coupon?", options: ["Non-linearly with both","Linearly with both — equal-sized moves have equal-sized impact","It does not vary with either","Only with the coupon"], correct: [1], tag: "concept", explain: "Levered return varies linearly with both cap rate and coupon — a 5%→6% cap rate move has the same impact as 4%→5%, and a coupon move of equal size has an equal (opposite-signed) impact." },
      { q: "How does levered return vary with LTV / turns of leverage?", options: ["Linearly","Non-linearly — moving from 60%→75% LTV has more impact than 45%→60%","It does not vary with leverage","Inversely and linearly"], correct: [1], tag: "concept", explain: "Levered return varies NON-linearly with LTV: going from 60%→75% LTV has more impact than 45%→60%. The more leverage, the riskier — and lenders charge more for it." },
      { q: "What is the key teaching point of the closing quote 'leverage is not a return engine'?", options: ["Leverage always creates return","Leverage is a magnifier — of the asset, of judgement, and of mistakes already made — not a source of return","Leverage should never be used","Leverage manufactures return from nothing"], correct: [1], tag: "concept", explain: "Leverage does not manufacture return — it magnifies what is already there: the asset, the judgement and the mistakes. If the asset is broken, leverage cannot fix it." },
      { q: "Comparing Deal A (6% unlevered, 55% LTV, 5% coupon) and Deal B (5% unlevered, 65% LTV, 4.5% coupon), what does the exercise conclude?", options: ["Deal B is always better","Deal A has higher return AND lower leverage; the choice 'depends on your aversion to risk'","The two deals are identical","Deal A uses more leverage"], correct: [1], tag: "concept", explain: "Deal A delivers a higher levered return (7.2%) with lower leverage; Deal B uses more leverage for a lower return (5.9%). The conclusion: it depends on your aversion to risk — A dominates on both counts here." },
      { q: "What is the legal instrument that gives a lender its claim on the asset if the borrower defaults?", options: ["The covenant","The mortgage","The cap rate","The coupon"], correct: [1], tag: "recall", explain: "The mortgage is the legal instrument — it is the lender's claim on the asset if the borrower defaults. A loan is usually secured against the real asset via the mortgage." },
      { q: "An LTV covenant is typically tested at what level relative to the lending LTV?", options: ["Exactly at the lending LTV","Around 5–10% above the lending LTV","50% below the lending LTV","There is no LTV covenant"], correct: [1], tag: "recall", explain: "An LTV covenant is typically set 5–10% above the lending LTV — a breach triggers if the property value falls enough to push the LTV above that covenant level." },
      { q: "Debt Yield is defined as:", options: ["NOI ÷ Loan Amount","Loan Amount ÷ NOI","NOI ÷ Debt Service","Loan ÷ Property Value"], correct: [0], tag: "calc", explain: "Debt Yield = NOI ÷ Loan Amount, typically around 6–10%. It differs from DSCR (NOI ÷ Debt Service) and from LTV (Loan ÷ Property Value)." },
      { q: "Which best describes the relationship between position in the capital stack and risk?", options: ["Position is a fixed role assigned by regulators","Position is a risk choice — you can be senior, mezz or equity on the same deal, at different risk and price","Position has no effect on risk","Only equity carries any risk"], correct: [1], tag: "concept", explain: "Position in the stack is a risk choice, not a fixed role. The same investor could take senior, mezzanine or equity exposure on the same deal — each is a different risk taken at a different price." },
      { q: "Why does a lender capture income growth only 'indirectly, via credit migration'?", options: ["Lenders receive a fixed coupon, so rising NOI improves the borrower's credit rather than the lender's cash return","Lenders receive all the income growth directly","Income growth reduces the coupon","Lenders never benefit from income growth in any way"], correct: [0], tag: "concept", explain: "A lender's coupon is contractual and fixed, so rising NOI does not raise the lender's cash return. It only benefits the lender indirectly — by improving the borrower's credit quality (credit migration)." },
      { q: "In the leverage / equity wipeout exercise, while equity is being eroded by falling values, the debt is:", options: ["Wiped out before the equity","Still fully covered until the asset value falls to the debt level","Reduced proportionally with equity","Increased automatically"], correct: [1], tag: "concept", explain: "As asset value falls, equity absorbs the loss first. The debt stays fully covered until the asset value falls all the way to the debt amount — at which point the equity is fully wiped out." },
      { q: "Capital diversification — equity deploying across more deals and vintages — is classified as which kind of benefit?", options: ["An investment-level benefit","A fund-level benefit","A risk, not a benefit","A regulatory requirement"], correct: [1], tag: "recall", explain: "Capital diversification — spreading equity across more deals, vintages and larger portfolios — is a fund-level benefit of leverage, alongside dividend recapitalisation." },
      { q: "Cash-on-Cash yield for an equity investor is approximately:", options: ["Cap Rate − Recurring CapEx","Cap Rate + Coupon","NOI ÷ Debt Service","LTV × Coupon"], correct: [0], tag: "concept", explain: "Cash-on-Cash yield ≈ Cap Rate − Recurring CapEx. It is the current-income return earned simply by holding the asset — the equity-investor equivalent of the lender's coupon." },
      { q: "Which statement about covenant constraints as a risk of leverage is correct?", options: ["Covenants eliminate all risk for the borrower","DSCR, LTV and debt yield covenants can trigger forced selling — an investment-level risk","Covenants only benefit the borrower","Covenants are a fund-level benefit"], correct: [1], tag: "concept", explain: "Covenant constraints are an investment-level risk: DSCR, LTV and debt yield covenants can be breached and trigger forced selling at a bad time — a real downside of using leverage." },
      { q: "Why does more leverage lead lenders to charge a higher coupon?", options: ["Lenders dislike large loans","Higher leverage is riskier for the lender, so they require more compensation for the risk taken","Regulation fixes the coupon","Higher leverage always means a safer loan"], correct: [1], tag: "concept", explain: "More leverage means a thinner equity cushion beneath the lender — more risk. Lenders charge a higher coupon to compensate for that additional risk, which is why levered return rises non-linearly with LTV." },
      { q: "Which single principle unifies the pricing of equity, mezzanine and senior debt?", options: ["Every return is yield + spread × turns — the same identity, you just change the basis","All tranches earn the same return","Only equity has a return","Returns are random"], correct: [0], tag: "concept", explain: "The same identity — return is yield plus spread times turns of leverage — prices equity, mezzanine and senior debt alike. You just change the basis: it is one deal viewed from different seats." },
      { q: "A loan with '4% amortisation' over its term is best described as:", options: ["A bullet loan with 0% amortisation","A partially amortising loan — the balance is paid down over time, de-risking the lender","A loan with no interest","A loan that never repays principal"], correct: [1], tag: "concept", explain: "Amortisation means repaying the balance over the loan's life. A 4% amortising loan pays down principal gradually — de-risking the lender — as opposed to a bullet loan, which repays everything at maturity." }
    ],
  },
];

const UPLOAD_TEMPLATE = `[
  {
    "q": "Your question text here?",
    "options": ["Option A", "Option B", "Option C", "Option D"],
    "correct": [1],
    "explain": "Why the answer is right.",
    "tag": "concept"
  }
]`;

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function prepare(q){
  let pool=q.options.map((text,i)=>({text,i})); let order;
  if(q.lockLast){ const last=q.options.length-1; order=[...shuffle(pool.filter(o=>o.i!==last)),pool[last]]; }
  else { order=shuffle(pool); }
  const cs=new Set(q.correct);
  return {...q, shuffledOptions:order, correctShuffled:order.map((o,p)=>cs.has(o.i)?p:-1).filter(p=>p!==-1)};
}
function setsEqual(a,b){ if(a.length!==b.length) return false; const sb=new Set(b); return a.every(x=>sb.has(x)); }
const TAG_LABELS={trap:"Trap",concept:"Concept",calc:"Calculation",recall:"Recall"};

// ---- localStorage helpers ----
const STORE_KEY="re-quiz-progress-v1";
function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||{}; }catch(e){ return {}; } }
function saveStore(s){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(s)); }catch(e){} }

// A stable id for a question (its text) so the wrong-pool survives shuffling.
function qid(q){ return q.q; }
// Look up a question object by id within a session.
function findQuestion(session,id){ return session.questions.find(q=>qid(q)===id); }

function App(){
  const [sessions,setSessions]=useState(SESSIONS);
  const [screen,setScreen]=useState("home");
  const [activeSession,setActiveSession]=useState(null);
  const [deck,setDeck]=useState([]);
  const [idx,setIdx]=useState(0);
  const [picks,setPicks]=useState([]);
  const [locked,setLocked]=useState(false);
  const [results,setResults]=useState([]);
  const [deckMode,setDeckMode]=useState("full"); // full | pool | combined
  const [uploadText,setUploadText]=useState("");
  const [uploadMsg,setUploadMsg]=useState(null);
  const [store,setStore]=useState(loadStore);

  useEffect(()=>{ saveStore(store); },[store]);

  const totalQuestions=sessions.reduce((s,x)=>s+x.questions.length,0);

  // ---- wrong-answer pool helpers ----
  // store[sessionId].pool is an array of question ids (the question text).
  function poolFor(sessionId){ return (store[sessionId]&&store[sessionId].pool)||[]; }
  function poolCount(sessionId){ return poolFor(sessionId).length; }
  function totalPoolCount(){ return sessions.reduce((n,s)=>n+poolCount(s.id),0); }

  function updatePool(sessionId,questionId,wasCorrect){
    setStore(prev=>{
      const s={...prev};
      const sess={...(s[sessionId]||{correct:0,wrong:0,pool:[]})};
      const pool=new Set(sess.pool||[]);
      if(wasCorrect) pool.delete(questionId);   // mastered — leaves the pool
      else pool.add(questionId);                // missed — enters the pool
      sess.pool=[...pool];
      s[sessionId]=sess;
      return s;
    });
  }

  function recordResult(sessionId,correct){
    setStore(prev=>{
      const s={...prev};
      const sess={...(s[sessionId]||{correct:0,wrong:0,pool:[]})};
      sess.correct=(sess.correct||0)+(correct?1:0);
      sess.wrong=(sess.wrong||0)+(correct?0:1);
      s[sessionId]=sess;
      return s;
    });
  }

  function startSession(session){
    if(!session.questions.length) return;
    setActiveSession(session);
    setDeckMode("full");
    setDeck(shuffle(session.questions).map(prepare));
    setIdx(0); setPicks([]); setLocked(false); setResults([]);
    setScreen("quiz");
  }

  // Drill only the wrong-answer pool for a single session.
  function startPoolDrill(session){
    const ids=poolFor(session.id);
    const qs=ids.map(id=>findQuestion(session,id)).filter(Boolean);
    if(!qs.length) return;
    setActiveSession(session);
    setDeckMode("pool");
    setDeck(shuffle(qs).map(prepare));
    setIdx(0); setPicks([]); setLocked(false); setResults([]);
    setScreen("quiz");
  }

  // Drill the combined wrong-answer pool across every session.
  function startCombinedPoolDrill(){
    let qs=[];
    sessions.forEach(s=>{
      poolFor(s.id).forEach(id=>{
        const q=findQuestion(s,id);
        if(q) qs.push({q:q,sessionId:s.id});
      });
    });
    if(!qs.length) return;
    const combined={id:"__combined__",name:"All wrong answers",short:"Wrong-answer pool",color:"#A32D2D",bg:"#FCEBEB"};
    setActiveSession(combined);
    setDeckMode("combined");
    setDeck(shuffle(qs).map(item=>({...prepare(item.q),__sessionId:item.sessionId})));
    setIdx(0); setPicks([]); setLocked(false); setResults([]);
    setScreen("quiz");
  }

  const cur=deck[idx];
  const isMulti=cur&&cur.correctShuffled.length>1;

  function togglePick(pos){
    if(locked) return;
    if(isMulti){ setPicks(p=>p.includes(pos)?p.filter(x=>x!==pos):[...p,pos]); }
    else { setPicks([pos]); submitAnswer([pos]); }
  }
  function submitAnswer(fp){
    const correct=setsEqual(fp,cur.correctShuffled);
    setLocked(true);
    setResults(r=>[...r,{question:cur,picks:fp,status:correct?"correct":"wrong"}]);
    // The session a question belongs to: its own session, or (in a combined
    // drill) the session tagged onto the question.
    const sid=cur.__sessionId||activeSession.id;
    recordResult(sid,correct);
    updatePool(sid,qid(cur),correct);
  }
  function next(){
    if(idx+1>=deck.length){ setScreen("results"); }
    else { setIdx(idx+1); setPicks([]); setLocked(false); }
  }

  const correctCount=results.filter(r=>r.status==="correct").length;
  const wrongCount=results.filter(r=>r.status==="wrong").length;

  const wrap={maxWidth:760,margin:"0 auto",color:"#2C2C2A"};
  const btn={display:"flex",alignItems:"center",gap:6,borderRadius:10,padding:"12px 14px",fontSize:14,fontWeight:500,justifyContent:"center"};
  const backBtn={background:"none",border:"none",cursor:"pointer",color:"#5F5E5A",fontSize:13,padding:0};
  const pill=(c,b)=>({fontSize:12,fontWeight:500,borderRadius:6,padding:"3px 9px",color:c,background:b,display:"inline-block"});

  // ---- HOME ----
  if(screen==="home"){
    const combinedCount=totalPoolCount();
    return (
      <div style={wrap}>
        <div style={{marginBottom:18}}>
          <h1 style={{fontSize:22,fontWeight:600,margin:"0 0 6px"}}>RE Capital Markets — Exam Prep</h1>
          <p style={{fontSize:15,color:"#5F5E5A",margin:0,lineHeight:1.6}}>
            ESCP MSc Real Estate. Pick a session to drill. Progress and your wrong-answer pools are saved in this browser. {totalQuestions} questions in the pool.
          </p>
        </div>

        {combinedCount>0&&(
          <div style={{background:"#FCEBEB",border:"0.5px solid #F0997B",borderRadius:12,padding:"14px 16px",marginBottom:16}}>
            <div style={{fontSize:15,fontWeight:600,color:"#A32D2D",marginBottom:2}}>Wrong-answer pool</div>
            <div style={{fontSize:13,color:"#993C1D",marginBottom:10}}>
              {combinedCount} question{combinedCount===1?"":"s"} you've missed, across all sessions. Answer one correctly and it leaves the pool.
            </div>
            <button onClick={startCombinedPoolDrill} style={{...btn,width:"100%",background:"#A32D2D",color:"#fff",border:"none",cursor:"pointer"}}>
              Drill all wrong answers
            </button>
          </div>
        )}

        <div style={{display:"grid",gap:12}}>
          {sessions.map(s=>{
            const ready=s.questions.length>0;
            const st=store[s.id];
            const pc=poolCount(s.id);
            return (
              <div key={s.id} style={{background:"#fff",border:`0.5px solid ${ready?"#D3D1C7":"#E8E6DF"}`,borderLeft:`4px solid ${ready?s.color:"#D3D1C7"}`,borderRadius:12,padding:"14px 16px"}}>
                <div style={{fontSize:16,fontWeight:600,marginBottom:3}}>{s.name}</div>
                <div style={{fontSize:13,color:"#5F5E5A"}}>
                  {ready?`${s.questions.length} questions`:"Library being added"}
                  {st?`  ·  lifetime: ${st.correct||0} right, ${st.wrong||0} wrong`:""}
                </div>
                {pc>0&&(
                  <div style={{fontSize:13,color:"#A32D2D",marginTop:4,fontWeight:500}}>
                    Wrong-answer pool: {pc} question{pc===1?"":"s"} to re-drill
                  </div>
                )}
                <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
                  <button onClick={()=>startSession(s)} disabled={!ready} style={{...btn,flex:"1 1 120px",cursor:ready?"pointer":"default",background:ready?s.color:"#EDEBE4",color:ready?"#fff":"#A8A69E",border:"none"}}>
                    {ready?"Start quiz":"No questions yet"}
                  </button>
                  <button onClick={()=>startPoolDrill(s)} disabled={pc===0} style={{...btn,flex:"1 1 120px",cursor:pc?"pointer":"default",background:"#fff",color:pc?"#A32D2D":"#A8A69E",border:`0.5px solid ${pc?"#F0997B":"#E8E6DF"}`}}>
                    Drill wrong ({pc})
                  </button>
                  <button onClick={()=>{setActiveSession(s);setUploadText("");setUploadMsg(null);setScreen("upload");}} style={{...btn,cursor:"pointer",background:"#fff",color:"#2C2C2A",border:"0.5px solid #D3D1C7"}}>
                    Add questions
                  </button>
                </div>
              </div>
            );
          })}
        </div>
        <div style={{marginTop:18,fontSize:13,color:"#888780"}}>
          Missed questions go into a wrong-answer pool, saved on this device. Answer one correctly in a drill and it leaves that pool.
        </div>
      </div>
    );
  }

  // ---- UPLOAD ----
  if(screen==="upload"){
    function doUpload(){
      try{
        const parsed=JSON.parse(uploadText);
        if(!Array.isArray(parsed)) throw new Error("Top level must be an array [ ... ].");
        parsed.forEach((q,i)=>{
          if(!q.q||!Array.isArray(q.options)||!Array.isArray(q.correct)||!q.explain)
            throw new Error(`Question ${i+1} is missing q, options, correct, or explain.`);
        });
        setSessions(prev=>prev.map(s=>s.id===activeSession.id?{...s,questions:[...s.questions,...parsed]}:s));
        setActiveSession(s=>({...s,questions:[...s.questions,...parsed]}));
        setUploadMsg({ok:true,text:`Added ${parsed.length} question(s).`});
        setUploadText("");
      }catch(e){ setUploadMsg({ok:false,text:`Couldn't parse: ${e.message}`}); }
    }
    return (
      <div style={wrap}>
        <button onClick={()=>setScreen("home")} style={backBtn}>← Sessions</button>
        <h1 style={{fontSize:20,fontWeight:600,margin:"12px 0 4px"}}>Add questions</h1>
        <p style={{fontSize:14,color:"#5F5E5A",margin:"0 0 14px",lineHeight:1.6}}>
          Paste a JSON array to add to <b>{activeSession.name}</b>. Uploaded questions last until the page reloads.
        </p>
        <button onClick={()=>{navigator.clipboard&&navigator.clipboard.writeText(UPLOAD_TEMPLATE);setUploadMsg({ok:true,text:"Template copied."});}} style={{...btn,cursor:"pointer",background:"#fff",color:"#2C2C2A",border:"0.5px solid #D3D1C7",marginBottom:10}}>
          Copy format template
        </button>
        <textarea value={uploadText} onChange={e=>setUploadText(e.target.value)} placeholder="Paste JSON array here..." style={{width:"100%",minHeight:200,fontSize:13,padding:12,borderRadius:10,border:"0.5px solid #D3D1C7",resize:"vertical"}} />
        {uploadMsg&&<div style={{marginTop:10,fontSize:13,padding:"10px 12px",borderRadius:8,background:uploadMsg.ok?"#E1F5EE":"#FCEBEB",color:uploadMsg.ok?"#0F6E56":"#A32D2D"}}>{uploadMsg.text}</div>}
        <button onClick={doUpload} disabled={!uploadText.trim()} style={{...btn,width:"100%",marginTop:12,cursor:uploadText.trim()?"pointer":"default",background:uploadText.trim()?activeSession.color:"#EDEBE4",color:uploadText.trim()?"#fff":"#A8A69E",border:"none"}}>
          Add to {activeSession.short}
        </button>
      </div>
    );
  }

  // ---- QUIZ ----
  if(screen==="quiz"){
    return (
      <div style={wrap}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}>
          <button onClick={()=>setScreen("home")} style={backBtn}>← Sessions</button>
          <div style={{fontSize:13,color:"#5F5E5A"}}>Q {idx+1}/{deck.length} · <span style={{color:"#0F6E56"}}>{correctCount} right</span> · <span style={{color:"#A32D2D"}}>{wrongCount} wrong</span></div>
        </div>
        <div style={{height:6,background:"#F1EFE8",borderRadius:3,marginBottom:16,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${((idx+(locked?1:0))/deck.length)*100}%`,background:activeSession.color}}/>
        </div>
        <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
          <span style={pill(activeSession.color,activeSession.bg)}>{activeSession.short}</span>
          {deckMode!=="full"&&<span style={pill("#A32D2D","#FCEBEB")}>Wrong-answer drill</span>}
          {cur.tag&&<span style={pill("#5F5E5A","#F1EFE8")}>{TAG_LABELS[cur.tag]||cur.tag}</span>}
          {isMulti&&<span style={pill("#854F0B","#FAEEDA")}>Select all that apply</span>}
        </div>
        <h2 style={{fontSize:18,fontWeight:600,margin:"0 0 16px",lineHeight:1.5}}>{cur.q}</h2>
        <div style={{display:"grid",gap:10}}>
          {cur.shuffledOptions.map((opt,i)=>{
            const isCorrect=cur.correctShuffled.includes(i);
            const isPicked=picks.includes(i);
            let border="0.5px solid #D3D1C7",bg="#fff",mark=null;
            if(locked){
              if(isCorrect){border="1.5px solid #0F6E56";bg="#E1F5EE";mark=<span style={{color:"#0F6E56",fontWeight:700}}>✓</span>;}
              else if(isPicked){border="1.5px solid #A32D2D";bg="#FCEBEB";mark=<span style={{color:"#A32D2D",fontWeight:700}}>✕</span>;}
            } else if(isPicked){ border=`1.5px solid ${activeSession.color}`;bg=activeSession.bg; }
            return (
